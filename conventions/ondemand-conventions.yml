pagination:
  styles:
  - offset-based
  - cursor-based
  params:
    offset: [page, limit, sort]
    cursor: [cursor, limit, sort]
  note: >-
    Media/collection listings use offset-based pagination (page/limit); chat
    session/message listings use cursor-based pagination (cursor/limit). Both
    accept a sort parameter.
  docs: https://docs.on-demand.io/reference/how-to-paginate
response_modes:
  field: responseMode
  values: [sync, stream, webhook]
  note: >-
    Chat query submission supports synchronous, streaming, and webhook delivery
    of responses (see Webhooks).
idempotency:
  supported: false
  note: >-
    OnDemand does not document an idempotency-key mechanism. Do not assume safe
    retries for POST operations.
