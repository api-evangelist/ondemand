aid: ondemand
name: Ondemand
description: OnDemand AI (on-demand.io) is a RAG-powered AI Platform-as-a-Service that lets companies
  infuse AI into their products without managing model infrastructure. The platform exposes a REST API
  for chat sessions and queries against a library of predefined, BYOI (Bring Your Own Inference) and BYOM
  (Bring Your Own Model) fulfillment models, media ingestion and vector search, Knowledge / REST-API /
  IoT(MQTT) agents, an Agents Flow Builder for workflow automation, and cloud services for speech-to-text,
  text-to-speech and language translation. API access is authenticated with API keys, supports sync /
  stream / webhook response modes, offset- and cursor-based pagination, and per-object rate limits. Surfaced
  as a Canaan Partners portfolio lead and enriched from the provider's public developer documentation
  at docs.on-demand.io.
